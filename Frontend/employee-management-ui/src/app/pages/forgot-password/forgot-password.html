<div class="auth-page">
  <div class="forgot-container">
    <!-- Forgot Password Card -->
    <div class="card auth-card">
      <div class="card-body">
        <!-- Header -->
        <div class="forgot-header">
          <h2 class="auth-title">Forgot Password?</h2>

          <p class="auth-subtitle">Enter your email address to reset your password.</p>
        </div>

        <!-- Form -->
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
          <!-- Email -->
          <div class="form-field">
            <label for="email" class="form-label custom-label"> Email Address </label>

            <input
              id="email"
              type="email"
              class="form-control custom-input"
              formControlName="email"
              placeholder="Enter your email"
            />

            @if (
              forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid
            ) {
              <div class="invalid-message">Please enter a valid email address.</div>
            }
          </div>

          <!-- Send Button -->
          <button type="submit" class="btn btn-reset" [disabled]="forgotPasswordForm.invalid">
            Send Reset Link
          </button>
        </form>

        <!-- Login Section -->
        <div class="login-section">
          <span> Remember your password? </span>

          <a routerLink="/login" class="login-link"> Sign In </a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="copyright">© 2026 Employee Management System</div>
  </div>
</div>
