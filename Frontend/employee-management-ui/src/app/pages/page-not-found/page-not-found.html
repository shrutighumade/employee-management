<div class="not-found-wrapper">
  <div class="not-found-card">
    <div class="error-badge-container">
      <div class="error-icon">
        <i class="fa-solid fa-ghost"></i>
      </div>
      <h1 class="error-code">404</h1>
    </div>

    <h2 class="error-title">Page Not Found</h2>
    <p class="error-description">
      Oops! The page you are looking for doesn't exist, was removed, or is temporarily unavailable.
    </p>

    <div class="action-buttons">
      <button type="button" class="btn-secondary-custom" (click)="goBack()">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Go Back</span>
      </button>

      <button type="button" class="btn-primary-custom" (click)="goHome()">
        <i class="fa-solid fa-house"></i>
        <span>Back to Dashboard</span>
      </button>
    </div>
  </div>
</div>
